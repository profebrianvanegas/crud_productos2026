<div class="min-h-screen bg-gradient-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
    <p-card class="w-full max-w-md shadow-2xl">
        <ng-template pTemplate="header">
            <div class="text-center py-6">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-100 mb-4">
                    <i class="pi pi-user text-3xl text-indigo-600"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Iniciar Sesión</h2>
                <p class="text-gray-600 text-sm">Ingresa tus credenciales para acceder</p>
            </div>
        </ng-template>

        <form [formGroup]="formLogin" class="space-y-6 px-2 pb-2">
            <!-- Email Field -->
            <div class="space-y-2">
                <label for="email" class="block text-sm font-medium text-gray-700">
                    Correo Electrónico
                </label>
                <input type="email" formControlName="email" pInputText placeholder="ejemplo@correo.com" class="w-full" />
            </div>

            <!-- Password Field -->
            <div class="space-y-2">
                <label for="password" class="block text-sm font-medium text-gray-700">
                    Contraseña
                </label>
                <p-password formControlName="password" name="password" placeholder="••••••••"
                    [toggleMask]="true" [feedback]="false" inputStyleClass="w-full" styleClass="w-full" />
            </div>

            <!-- Login Button -->
            <button pButton pRipple type="submit" label="Ingresar" class="w-full py-3 text-base font-semibold"
                style="background-color: #4f46e5; border-color: #4f46e5;">
            </button>

            <!-- Register Link -->
            <div class="text-center mt-4">
                <p class="text-sm text-gray-600">
                    ¿No tienes una cuenta?
                    <a href="#" class="text-indigo-600 hover:text-indigo-800 font-medium ml-1">
                        Regístrate aquí
                    </a>
                </p>
            </div>
        </form>
    </p-card>

    <pre>{{formLogin.value | json}}</pre>
</div>
